[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "venv",
    ".venv",
    "migrations",
    "__pycache__",
    "db.sqlite3",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"