{% extends "base.html" %}

{% block title %}{{ page_title }} - MotorMind{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 mb-0">{{ page_title }}</h1>
    <a href="{% url 'workshop_services:service_catalog_list' %}" class="btn btn-outline-secondary">Voltar</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">{{ button_text }}</button>
        </form>
    </div>
</div>
{% endblock %}
