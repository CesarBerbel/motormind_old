<div class="{{ field_wrapper_class|default:'col-12' }}">
    {% if field.field.widget.input_type == "checkbox" %}
        <div class="form-check">
            {{ field }}
            <label for="{{ field.id_for_label }}" class="form-check-label">
                {{ field.label }}
            </label>
        </div>
    {% else %}
        <label for="{{ field.id_for_label }}" class="form-label">
            {{ field.label }}
        </label>

        {{ field }}
    {% endif %}

    {% if field.help_text %}
        <div class="form-text">
            {{ field.help_text }}
        </div>
    {% endif %}

    {% if field.errors %}
        <div class="text-danger small mt-1">
            {{ field.errors }}
        </div>
    {% endif %}
</div>
