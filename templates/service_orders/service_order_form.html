{% extends "base.html" %}
{% load static %}

{% block title %}
    {{ page_title }} - Sistema de Oficina
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-9">

        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="h4 mb-4">
                    {{ page_title }}
                </h1>

                <form method="post" novalidate>
                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'service_orders:service_order_list' %}" class="btn btn-outline-secondary">
                            Voltar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            {{ button_text }}
                        </button>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

<script src="{% static 'js/brl_money_mask.js' %}"></script>

<script>
    // This script loads only vehicles that belong to the selected customer.
    document.addEventListener("DOMContentLoaded", function () {
        const customerSelect = document.getElementById("id_customer");
        const vehicleSelect = document.getElementById("id_vehicle");

        if (!customerSelect || !vehicleSelect) {
            return;
        }

        const vehiclesUrl = "{% url 'service_orders:vehicles_by_customer' %}";

        function resetVehicleOptions() {
            vehicleSelect.innerHTML = "";

            const defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = "Selecione um veículo";

            vehicleSelect.appendChild(defaultOption);
        }

        function loadVehicles(customerId) {
            resetVehicleOptions();

            if (!customerId) {
                return;
            }

            fetch(`${vehiclesUrl}?customer_id=${customerId}`, {
                method: "GET",
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("Erro ao carregar veículos.");
                    }

                    return response.json();
                })
                .then(function (data) {
                    data.vehicles.forEach(function (vehicle) {
                        const option = document.createElement("option");

                        option.value = vehicle.id;
                        option.textContent = vehicle.text;

                        vehicleSelect.appendChild(option);
                    });
                })
                .catch(function () {
                    resetVehicleOptions();

                    const errorOption = document.createElement("option");
                    errorOption.value = "";
                    errorOption.textContent = "Não foi possível carregar os veículos";

                    vehicleSelect.appendChild(errorOption);
                });
        }

        customerSelect.addEventListener("change", function () {
            loadVehicles(customerSelect.value);
        });
    });
</script>

{% endblock %}
